<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px Arial, sans-serif; fill: #0f172a; }
      .wire { stroke: #0f172a; stroke-width: 3; fill: none; }
      .device { stroke: #0f172a; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" class="title">Log / Peak Detector / Nonlinear Analog Circuit</text>

  <line x1="60" y1="160" x2="150" y2="160" class="wire"/>
  <polygon points="150,95 150,225 245,160" class="device"/>
  <line x1="245" y1="160" x2="340" y2="160" class="wire"/>
  <line x1="340" y1="160" x2="340" y2="90" class="wire"/>
  <line x1="340" y1="90" x2="440" y2="90" class="wire"/>
  <line x1="440" y1="90" x2="440" y2="230" class="wire"/>
  <line x1="440" y1="230" x2="340" y2="230" class="wire"/>
  <line x1="340" y1="230" x2="340" y2="160" class="wire"/>
  <line x1="440" y1="160" x2="620" y2="160" class="wire"/>

  <path d="M 165 200 Q 205 100 238 200" stroke="#2563eb" stroke-width="3" fill="none"/>

  <text x="40" y="145" class="label">Vin</text>
  <text x="660" y="146" class="label">Vout</text>
</svg>
