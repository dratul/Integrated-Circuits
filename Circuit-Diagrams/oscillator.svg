  <line x1="520" y1="90" x2="620" y2="90" class="wire"/>
  <line x1="620" y1="90" x2="620" y2="220" class="wire"/>
  <line x1="620" y1="220" x2="700" y2="220" class="wire"/>

  <path d="M 205 190 L 245 190 L 290 110 L 330 190 L 370 110 L 410 190" stroke="#2563eb" stroke-width="3" fill="none"/>
  <text x="60" y="145" class="label">Vin/Trigger</text>
  <text x="720" y="146" class="label">Vout</text>
