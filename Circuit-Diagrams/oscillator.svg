  <polygon points="180,70 180,250 410,160" class="device"/>
  <line x1="50" y1="160" x2="180" y2="160" class="wire"/>
  <line x1="410" y1="160" x2="700" y2="160" class="wire"/>

  <line x1="260" y1="80" x2="260" y2="240" class="wire"/>
